spring:
  application:
    name: solicitations-api
  # No default in-memory user (it logs a generated password)
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, metrics

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED}

logging:
  level:
    com.alexandre.solicitations: ${LOG_LEVEL}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

viacep:
  url: ${VIACEP_URL}
